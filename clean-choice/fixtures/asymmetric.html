<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Asymmetric upgrade</title>
    <style>
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        margin: 24px;
        background: #fff;
        color: #111;
      }
      .upsell {
        border: 1px solid #ddd;
        padding: 16px;
        max-width: 520px;
      }
      .primary {
        background: #0b6b3a;
        color: #fff;
        border: 0;
        border-radius: 24px;
        padding: 16px 48px;
        font-size: 20px;
        font-weight: 700;
      }
      .link {
        background: none;
        border: 0;
        padding: 0;
        color: #9ca3af;
        text-decoration: underline;
        font-size: 13px;
      }
      .secondary {
        background: #fff;
        color: #0b6b3a;
        border: 2px solid #0b6b3a;
        border-radius: 24px;
        padding: 16px 48px;
        font-size: 20px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <form class="upsell" onsubmit="return false;">
      <h2>Upgrade to Economy bundle</h2>
      <p>Carry-on bag, seat selection, and flexible changes for <strong>$89.00</strong> per traveler.</p>
      <label>Traveler name <input id="traveler" name="traveler" /></label>
      <p><button type="button" class="primary" data-action="upgrade">Upgrade</button></p>
      <p><a href="#" class="link" data-action="continue" onclick="return false;">Continue</a></p>
    </form>
    <script>
      window.__clicks = [];
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (t) window.__clicks.push(t.dataset.action);
      });
    </script>
  </body>
</html>
